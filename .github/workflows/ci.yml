# CI do Aion, só sob demanda (PROC-01): roda apenas por disparo manual (`workflow_dispatch`), no fim de cada phase e com aprovação do
# dono. Não há gatilho de `push` nem de `pull_request`: antes de cada push vale o gate local (typecheck, lint, testes, gitleaks e
# `pnpm audit --audit-level high`, ver AGENTS.md e docs/operacao.md). O deploy do Easypanel é automático no push da `main` e não espera o CI.
# Quatro jobs independentes:
#   verify:  instala com lockfile congelado, typecheck, lint, testes (com PostgreSQL), gitleaks e pnpm audit;
#   e2e:     Playwright + axe contra a pilha de produção (API, Next standalone e proxy);
#   docker:  constrói as quatro imagens (api, worker, web e sandbox) a partir da raiz do repositório (o Easypanel faz o mesmo no deploy);
#   sandbox: suítes em container do serviço `sandbox` do Python (execução, fuga e limites) e a prova worker -> sandbox real.
# Qualquer falha reprova a execução. Actions fixadas por SHA de commit (a versão vai no comentário).
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Serviço PostgreSQL do job: os testes criam um banco por arquivo nele (ver packages/core/src/testing).
  # Credenciais descartáveis de um contêiner que só existe durante o job.
  AION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Histórico completo: o gitleaks varre todos os commits, não só o último.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm test
      - name: gitleaks (binário fixado, checksum conferido)
        run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks.sha256 "${base}/gitleaks_${version}_checksums.txt"
          grep " gitleaks_${version}_linux_x64.tar.gz\$" gitleaks.sha256 | sed 's/gitleaks_.*/gitleaks.tgz/' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-banner --redact --source .
      # Bloqueia em vulnerabilidade alta ou crítica, em dependências de produção e de desenvolvimento.
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aion/web exec playwright install --with-deps chromium
      # A pilha do E2E faz o build da API e da web antes de subir.
      - run: pnpm --filter @aion/web test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web, sandbox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Contexto = raiz do repositório, como no Easypanel; só constrói, não publica.
      - run: docker build --file apps/${{ matrix.service }}/Dockerfile --tag aion-${{ matrix.service }}:ci .

  # Suítes do sandbox que exigem Docker e o Node 26 da imagem (fora do `pnpm test` do job verify): o script constrói a imagem, sobe o
  # sandbox (com `--memory 3g`, como no Easypanel) e um canário numa rede Docker isolada, roda as suítes de execução, fuga e limites e a
  # prova worker -> sandbox (`pnpm test python-sandbox`, que usa o PostgreSQL do job pelo AION_TEST_DATABASE_URL) e derruba tudo ao final.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aion/sandbox test:container
