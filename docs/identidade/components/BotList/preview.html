/* ===== Estados de interação (hover só com ponteiro fino; no toque vale o :active) ===== */
.b,.bi,.si,.hrow,.mi,.mr,.it,.ar,.rk,.tab,.nv,.li,.chip,.dl,.sw,.dy,.fp,.sg span,.trg,.a,.cbx,.in,.field,input,select,textarea,.ta,.c{transition:background-color var(--dur-fast,120ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),color var(--dur-fast,120ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),border-color var(--dur-fast,120ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),box-shadow var(--dur-fast,120ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),opacity var(--dur-fast,120ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),transform var(--dur-fast,120ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
.b,.bi,.si,.hrow,.mi,.mr,.it,.ar,.rk,.tab,.nv,.chip,.dl,.sw,.dy,.fp,.sg span,.trg,.a{cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ===== Entradas e saídas: [data-anim] + [data-state=open|closed] ===== */
[data-anim="pop"]{transform-origin:top left}[data-anim="pop-r"]{transform-origin:top right}[data-anim="tip"]{transform-origin:bottom center}
[data-anim="pop"],[data-anim="pop-r"]{animation:m-pop-in var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="pop"][data-state="closed"],[data-anim="pop-r"][data-state="closed"]{animation:m-pop-out var(--dur-fast,120ms) var(--ease-in,cubic-bezier(.4,0,1,1)) both}
[data-anim="tip"]{animation:m-tip-in var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="tip"][data-state="closed"]{animation:m-fade-out var(--dur-fast,120ms) var(--ease-in,cubic-bezier(.4,0,1,1)) both}
[data-anim="modal"]{animation:m-modal-in var(--dur-slow,250ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="modal"][data-state="closed"]{animation:m-modal-out 150ms var(--ease-in,cubic-bezier(.4,0,1,1)) both}
[data-anim="scrim"]{animation:m-fade-in var(--dur-slow,250ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="scrim"][data-state="closed"]{animation:m-fade-out 150ms var(--ease-in,cubic-bezier(.4,0,1,1)) both}
[data-anim="drawer"]{animation:m-drawer-in var(--dur-slow,250ms) var(--ease-drawer,cubic-bezier(.32,.72,0,1)) both}[data-anim="drawer"][data-state="closed"]{animation:m-drawer-out 200ms var(--ease-drawer,cubic-bezier(.32,.72,0,1)) both}
[data-anim="drawer-r"]{animation:m-drawer-r-in var(--dur-slow,250ms) var(--ease-drawer,cubic-bezier(.32,.72,0,1)) both}[data-anim="drawer-r"][data-state="closed"]{animation:m-drawer-r-out 200ms var(--ease-drawer,cubic-bezier(.32,.72,0,1)) both}
[data-anim="sheet"]{animation:m-sheet-in var(--dur-slow,250ms) var(--ease-drawer,cubic-bezier(.32,.72,0,1)) both}[data-anim="sheet"][data-state="closed"]{animation:m-sheet-out 200ms var(--ease-drawer,cubic-bezier(.32,.72,0,1)) both}
[data-anim="toast"]{animation:m-toast-in var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="toast"][data-state="closed"]{animation:m-toast-out var(--dur-fast,120ms) var(--ease-in,cubic-bezier(.4,0,1,1)) both}
[data-anim="dialog"]{animation:m-dialog-in var(--dur-slow,250ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="dialog"][data-state="closed"]{animation:m-pop-out 150ms var(--ease-in,cubic-bezier(.4,0,1,1)) both}
@keyframes m-dialog-in{from{opacity:0;transform:translateY(8px) scale(.96)}}
[data-anim="msg"]{animation:m-msg-in var(--dur-slow,250ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="card"]{animation:m-card-in var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}
[data-anim="fade"]{animation:m-fade-in var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}[data-anim="fade"][data-state="closed"]{animation:m-fade-out var(--dur-fast,120ms) var(--ease-in,cubic-bezier(.4,0,1,1)) both}
@keyframes m-pop-in{from{opacity:0;transform:scale(.96) translateY(-4px)}}@keyframes m-pop-out{to{opacity:0;transform:scale(.97)}}
@keyframes m-tip-in{from{opacity:0;transform:translateY(2px) scale(.97)}}@keyframes m-fade-in{from{opacity:0}}@keyframes m-fade-out{to{opacity:0}}
@keyframes m-modal-in{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}to{transform:translate(-50%,-50%)}}
@keyframes m-modal-out{from{transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
@keyframes m-drawer-in{from{transform:translateX(-100%)}}@keyframes m-drawer-out{to{transform:translateX(-100%)}}
@keyframes m-drawer-r-in{from{transform:translateX(100%)}}@keyframes m-drawer-r-out{to{transform:translateX(100%)}}
@keyframes m-sheet-in{from{transform:translateY(100%)}}@keyframes m-sheet-out{to{transform:translateY(100%)}}

/* ===== Microinterações ===== */
.m-bump{animation:m-bump 300ms var(--ease-spring,cubic-bezier(.34,1.56,.64,1))}@keyframes m-bump{40%{transform:scale(1.3)}}
.m-dot{animation:m-dot var(--dur-base,180ms) var(--ease-spring,cubic-bezier(.34,1.56,.64,1)) both}@keyframes m-dot{from{transform:scale(0)}}
.m-check{animation:m-check var(--dur-base,180ms) var(--ease-spring,cubic-bezier(.34,1.56,.64,1)) both}@keyframes m-check{from{transform:scale(.4);opacity:0}}
.m-pill{animation:m-pill var(--dur-slow,250ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}@keyframes m-pill{from{transform:scaleX(.5);opacity:.4}}
.m-next{animation:m-next var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)) both}@keyframes m-next{from{opacity:0;transform:translateX(12px)}}

.trk i{transition:left var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),background-color var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}.trk{transition:background-color var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1)),border-color var(--dur-base,180ms) var(--ease-out,cubic-bezier(.16,1,.3,1))}
